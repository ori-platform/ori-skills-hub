name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: none

jobs:
  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Guard supply-chain invariants
        run: python scripts/check_workflows.py

      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --no-deps -e .

      - name: Pre-commit
        run: SKIP=no-commit-to-branch pre-commit run --show-diff-on-failure --all-files

      - name: Tests
        run: pytest -q

      - name: Type check
        run: mypy hub

      - name: Audit pinned Python dependencies
        run: |
          python -m pip_audit -r requirements.txt
          python -m pip_audit -r requirements-dev.txt

      - name: Generate SBOM
        run: |
          python -m cyclonedx_py requirements requirements.txt \
            --pyproject pyproject.toml \
            --output-reproducible \
            --of JSON \
            -o sbom-hub.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-hub
          path: sbom-hub.json
          if-no-files-found: error
