[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ori-skills-hub"
version = "0.1.0"
description = "Community skill registry for the Ori platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Ori Nexus Systems LTD" }]
dependencies = [
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "cryptography>=50.0.0",
  "fastapi>=0.117",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "sqlalchemy[asyncio]>=2.0",
  "starlette>=1.3.1",
  "uvicorn>=0.27",
]

[project.scripts]
ori-hub-keys = "hub.security.hub_keys:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.15",
  "mypy>=1.8",
  "pre-commit>=3.7",
  "pip-audit>=2.7",
  "cyclonedx-bom>=4.0",
  "msgpack>=1.2.1",
]

[tool.setuptools.packages.find]
include = ["hub*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["hub"]

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true
